# FICTIONAL SAMPLE — /etc/open5gs/bsf.yaml

logger:
  file:
    path: /var/log/open5gs/bsf.log
  level: info

global:
  max:
    ue: 4096

bsf:
  sbi:
    server:
      - address: 127.0.0.15
        port: 7777
        advertise: open5gs-bsf.example.net:7777
    client:
      scp:
        - uri: http://127.0.0.200:7777
  metrics:
    server:
      - address: 127.0.0.15
        port: 9090

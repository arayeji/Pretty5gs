# FICTIONAL SAMPLE — /etc/open5gs/amf.yaml

logger:
  file:
    path: /var/log/open5gs/amf.log
  level: info

global:
  max:
    ue: 4096
    peer: 64

amf:
  sbi:
    server:
      - address: 127.0.0.5
        port: 7777
        advertise: open5gs-amf.example.net:7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777
      scp:
        - uri: http://127.0.0.200:7777
  ngap:
    server:
      - address: 127.0.0.5
        port: 38412
  metrics:
    server:
      - address: 127.0.0.5
        port: 9090
  guami:
    - plmn_id:
        mcc: "999"
        mnc: "70"
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: "999"
        mnc: "70"
      tac: [1, 2, 3]
  plmn_support:
    - plmn_id:
        mcc: "999"
        mnc: "70"
      s_nssai:
        - sst: 1
        - sst: 1
          sd: 000001
  security:
    integrity_order: [NIA2, NIA1, NIA0]
    ciphering_order: [NEA0, NEA1, NEA2]
  network_name:
    full: Open5GS
    short: Next
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
    t3502:
      value: 720

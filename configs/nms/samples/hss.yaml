db_uri: mongodb://127.0.0.1/open5gs
logger:
  file:
    path: /var/log/open5gs/hss.log
#  level: info   # fatal|error|warn|info(default)|debug|trace

global:
  max:
    ue: 1024  # The number of UE can be increased depending on memory size.
#    peer: 64
  # Optional Huawei HSS9860 Milenage K4 unwrap (disabled by default).
  # milenage:
  #   enabled: true
  #   k4_file: /etc/open5gs/open5gs/milenage_k4.key

hss:
  freeDiameter: /etc/open5gs/freeDiameter/hss.conf
  metrics:
    server:
      - address: 127.0.0.8
        port: 9090

# =============================================================================
# FICTIONAL NMS SAMPLE — not real operator data
# Generated from configs/open5gs/mme.yaml.in (+ fork reference overlay when present)
# PLMN 999/70, IMSI prefix 99970, 127.0.0.x lab addresses
# Regenerate: python3 tools/gen_nms_full_samples.py
# =============================================================================


# --- Active fictional values (fork reference overlay) ---
logger:
  file:
    path: /var/log/open5gs/mme.log
  level: info
  domain:
    mme: info
    s1ap: warn
    gtp: warn
    s6a: info
    nas: warn
global:
  max:
    ue: 4096
    peer: 64
    tai: 4096
    eps_tai0_partial_list: 20000
  parameter:
    use_upg_vpp: false
    prefer_ipv4: true
    # ignore_sgs: true   # skip SGsAP Location-Update (e.g. roamers); no VLR (SIGHUP)
    # fake_csfb: true    # Attach Accept Combined when HSS NAM is packet-only (SIGHUP)
  time:
    message:
      duration: 15000
mme:
  freeDiameter: /etc/open5gs/freeDiameter/mme.conf
  s1ap:
    server:
    - address: 127.0.0.2
      port: 36412
      option:
        sctp_nodelay: true
  gtpc:
    server:
    - address: 127.0.0.2
      port: 2123
    client:
      sgwc:
      - address: 127.0.0.3
        plmn_id:
          mcc: '999'
          mnc: '70'
        serving_plmn_id:
          mcc: '999'
          mnc: '71'
        tac:
        - 1
        - 2
        - 3
        e_cell_id:
        - abc1234
        - def5678
      smf:
      - address: 127.0.0.4
        imsi_plmn_id:
          mcc: '999'
          mnc: '70'
        apn: internet
        tac: 10
      sgsn:
      - address:
        - 127.0.0.5
        - fd84:7e51:54:49::2
        routes:
        - rai:
            lai:
              plmn_id:
                mcc: '999'
                mnc: '70'
              lac: 43690
            rac: 187
          ci: 1223
      - name: sgsn.example.net
        default_route: true
    recovery: 1
    echo_interval: 60
  metrics:
    server:
    - address: 127.0.0.2
      port: 9090
  gummei:
  - plmn_id:
      mcc: '999'
      mnc: '70'
    mme_gid: 2
    mme_code: 1
  tai:
  - plmn_id:
      mcc: '999'
      mnc: '70'
    tac:
    - 1
    - 2
    - 3
    - 10-20
  security:
    integrity_order:
    - EIA2
    - EIA1
    - EIA0
    ciphering_order:
    - EEA0
    - EEA1
    - EEA2
  network_name:
    full: Open5GS
    short: Next
  mme_name: open5gs-mme0
  time:
    t3412:
      value: 600
    t3413:
      value: 6
      max_count: 2
    bearer_setup:
      value: 12
      max_count: 4
  relative_capacity: 100
  trace_imsi:
  - '999700000000001'
  - '99970'
  attach_accept:
    tai_list: serving_only
    equivalent_plmn: true
    equivalent_plmn_serving_only: true
    ims_voice_over_ps: true
    t3402: false
    legacy_gprs_qos: true
  equivalent_plmn:
  - mcc: '999'
    mnc: '71'
  - mcc: '999'
    mnc: '72'
  inbound_roam:
    gtp_apn_format: fqdn
    gtp_apn_lowercase: false
    strip_pap_from_gtp_pco: false
    gtpc_plmn_id_is_imsi_plmn: true
    # APN policy for inbound roamers only (SIGHUP reloadable).
    # denied_apn always wins. Non-empty allowed_apn = allowlist mode.
    # allowed_apn: [internet]
    # denied_apn: [ims]
    # apn_reject_cause: 27
    # apn_rule:
    # - plmn_id: { mcc: 999, mnc: 70 }
    #   allowed_apn: [internet]
    #   denied_apn: [ims]
  # APN correction policy: what to do when the UE-requested APN or PDN
  # type does not match the S6a subscription. Rules are evaluated in
  # order, first match wins; no match = strict 3GPP (reject #27 / #28).
  # SIGHUP reloadable.
  #
  # apn_correction:
  # - name: no-correction-for-ims       # label for logs only
  #   imsi_prefix: ['43212995']         # absent = every subscriber
  #   requested_apn: [ims, ngn]         # absent = any APN, '*' = any
  #   on_apn_mismatch: reject           # reject (default) | correct
  #   reject_cause: 27                  # ESM cause when rejecting
  # - name: all-users
  #   on_apn_mismatch: correct          # swap the unknown APN for a
  #                                     # subscribed one instead of #27
  #   correct_to: default               # default (HSS Context-Identifier)
  #                                     # | first | <apn name>
  #   on_pdn_type_mismatch: correct     # correct | reject (default):
  #                                     # UE and subscription PDN types
  #                                     # do not overlap at all
  #   pdn_type: ipv4                    # clamp to ipv4 | ipv6 | ipv4v6
  #                                     # when the subscription allows it
  ambr_limit:
    enabled: false
    downlink: 100
    uplink: 100
  access_control:
  - default_reject_cause: 13
  - imsi_prefix: '99971'
    reject_cause: 15
    tac:
    - 100
    - 101
    enb_id:
    - 100001
    - 100002
  - plmn_id:
      mcc: '999'
      mnc: '70'
  imsi_acl:
  - '99970'
  - '99971'
  require_hss_map: false
  hss_map:
  - plmn_id:
      mcc: '999'
      mnc: '70'
    realm: localdomain
    host: hss.localdomain
  sgsap:
    client:
    - address: msc.example.net
      local_address: 127.0.0.2
      map:
        imsi_prefix: '99970'
        tai:
          plmn_id:
            mcc: '999'
            mnc: '70'
          tac: 1
  emergency:
    dnn: sos
    number:
    - digits: '112'
      categories:
      - police
      - ambulance
      - fire
  mip_home_agent_host_dns: true
  #
  # PGW selection (S11 Create Session PGW-C address), SIGHUP reloadable:
  #   0) gtpc.client.smf entry with force: true matching the session
  #      (apn / serving_plmn_id / imsi_plmn_id / imsi_prefix / tac /
  #       e_cell_id) always wins — overrides HSS MIP6 and APN DNS.
  #   mode: standard (default)
  #     1) HSS static MIP6 (allocation != DYNAMIC)
  #     2) APN DNS / S-NAPTR when dns.enabled (home/visited by roam)
  #     3) HSS MIP6 even if DYNAMIC (soft fallback)
  #     4) gtpc.client.smf YAML
  #   mode: force
  #     Always use gtpc.client.smf for every session (global force)
  #
  # Per-rule example:
  #   gtpc:
  #     client:
  #       smf:
  #       - address: 10.0.0.9
  #         apn: ims
  #         force: true          # ims PDNs always to 10.0.0.9
  # s1ap_io_write_queue_max: 10240  # per-eNB outbound S1AP PDU cap on the
  #                                 # IO thread (s1ap_io_thread: 1); PDUs
  #                                 # over the cap are dropped. SIGHUP
  #                                 # reloadable. 0/unset = default 10240.
  # s1ap_io_stall_teardown_sec: 10  # if one eNB's write queue stays full
  #                                 # this long, clear its TX queue and
  #                                 # drop S1 (CONNREFUSED). Protects the
  #                                 # shared IO/workers from a stuck cell.
  #                                 # 0/unset = 10. Negative = disable.
  #                                 # SIGHUP reloadable. ETIMEDOUT always
  #                                 # tears that assoc down.
  # s1ap_io_congest_depth: 2560     # per-eNB write-queue depth reported as
  #                                 # TX-congested to overload control.
  #                                 # 0/unset = s1ap_io_write_queue_max / 4.
  #                                 # SIGHUP reloadable.
  #
  # Overload control / ingress admission (s1ap-overload.c). On by
  # default; everything below is optional tuning. Two signals drive it:
  # an eNB whose downlink is backing up (s1ap_io_congest_depth) and the
  # MME's own event-queue lag. Response is OVERLOAD START to the eNB
  # plus dropping new InitialUEMessage from it. Emergency,
  # high-priority and mobile-terminated (paging response) access are
  # never shed.
  # overload:
  #   enabled: true                 # master switch (default true)
  #   signal_enb: true              # send S1AP OVERLOAD START/STOP
  #   enb_initial_ue_rate: 0        # max InitialUEMessage/s per eNB
  #                                 # (token bucket). 0 = unlimited.
  #   enb_initial_ue_burst: 0       # bucket size. 0 = 2x rate (min 20).
  #   congest_lease_sec: 3          # how long one IO congestion report
  #                                 # keeps an eNB throttled (reports
  #                                 # repeat every second while it lasts)
  #   lag_high_ms: 1500             # event-queue lag = MME overloaded
  #   lag_critical_ms: 4000         # ... severely (emergency/MT only)
  #   global_sustain_sec: 3         # lag must hold this long to count
  #   traffic_reduction: 50         # percent in OVERLOAD START
  #   resend_interval_sec: 10       # min gap between START re-sends
  #   recovery_sec: 5               # calm before OVERLOAD STOP
  # paging:
  #   first_wave: last_enb          # last_enb = smart paging: first wave
  #                                 # only to the UE's last eNB (from eCGI),
  #                                 # T3413 retries page the whole TA.
  #                                 # tai (default) = TA-wide every wave.
  #                                 # SIGHUP reloadable.
  # pkbuf_thread_pool: 2048         # per-thread pkbuf pools (0/unset = off).
  #                                 # mme_main + every shard/RX/TX/IO worker
  #                                 # allocates packet buffers from a private
  #                                 # pool instead of contending on the one
  #                                 # process-wide pool mutex. Value = cluster
  #                                 # count per size class (~13 MB RAM per
  #                                 # thread at 2048); exhaustion falls back
  #                                 # to the shared pool. Startup-only (NOT
  #                                 # SIGHUP reloadable).
  pgw_selection:
    mode: standard
    # force_yaml: true          # same as mode: force (global)
    dns:
      enabled: false            # set true for TS 29.303 APN-FQDN discovery
    # Per-APN policy rules (no PGW address needed). mode: dns resolves the
    # PGW via APN DNS only, ignoring HSS MIP6 and gtpc.client.smf. Runs
    # even when dns.enabled above is false. Match keys AND together
    # (apn / imsi_prefix / serving_plmn_id / imsi_plmn_id).
    # fallback on DNS failure: none (reject, default) | hss | yaml
    # rules:
    #   - imsi_plmn_id:         # all subscribers of one home PLMN
    #       mcc: '999'
    #       mnc: '70'
    #     mode: dns
    #     fallback: none
    #   - apn: someapn          # or per-APN; keys AND together
    #     mode: dns
    #     fallback: yaml


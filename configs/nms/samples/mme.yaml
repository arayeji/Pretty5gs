################################################################################
# 3GPP Specification
################################################################################
#  o GUMMEI
#  gummei:
#    - plmn_id:
#        mcc: 999
#        mnc: 70
#      mme_gid: 2
#      mme_code: 1
#    - plmn_id:
#        - mcc: 002
#          mnc: 02
#        - mcc: 003
#          mnc: 03
#      mme_gid: [3, 4]
#      mme_code:
#        - 2
#        - 3
#
#  o TAI
#  tai:
#    - plmn_id:
#        mcc: 999
#        mnc: 70
#      tac: [1, 3, 5]
#  tai:
#    - plmn_id:
#        mcc: 002
#        mnc: 02
#      tac: [6-10, 15-18]
#  tai:
#    - plmn_id:
#        mcc: 003
#        mnc: 03
#      tac: 20
#    - plmn_id:
#        mcc: 004
#        mnc: 04
#      tac: 21
#  tai:
#    - plmn_id:
#        mcc: 005
#        mnc: 05
#      tac: [22, 28]
#    - plmn_id:
#        mcc: 006
#        mnc: 06
#      tac: [30-32, 34, 36-38, 40-42, 44, 46, 48]
#    - plmn_id:
#        mcc: 007
#        mnc: 07
#      tac: 50
#    - plmn_id:
#        mcc: 008
#        mnc: 08
#      tac: 60
#    - plmn_id:
#        mcc: 009
#        mnc: 09
#      tac: [70, 80]
#
#  o Access Control (optional HPLMN whitelist + inbound-roam IMSI prefix / TAC / eNB)
#  access_control:
#    - default_reject_cause: 13
#    - imsi_prefix: "99970"       # inbound roam only; longest prefix match
#      reject_cause: 13
#      tac: [10003, 10012]        # optional; omit = all TACs OK for this prefix
#      enb_id: [260003, 450004]   # optional; omit = all eNB IDs OK
#    - plmn_id:                   # all subscribers: whole HPLMN (example 999-70)
#        mcc: 999
#        mnc: 70
#  Generate from CSV:
#    python scripts/gen_roam_access_from_csv.py \\
#      --csv "configs/open5gs/roam-sites.example.csv" --prefix 99970 --prefix 99970 \\
#          --output configs/open5gs/roam-access.generated.yaml
#
#  o Block unknown IMSIs before S6a (AIR/ULR) — stops HSS/DRA flood.
#    Enforced when any of: access_control, imsi_acl, or hss_map (with
#    require_hss_map, auto-enabled when hss_map is configured).
#  imsi_acl:
#    - 99970
#    - 99970
#  require_hss_map: true
#
#  o HSS Selection
#    o realm and host are optional
#    o realm will be generated from plmn_id if not provided
#    o host will not be used if not provided
#  hss_map:
#    - plmn_id:
#        mcc: 999
#        mnc: 70
#    - plmn_id:
#        mcc: 002
#        mnc: 02
#      realm: epc.mnc002.mcc002.3gppnetwork.org
#    - plmn_id:
#        mcc: 999
#        mnc: 70
#      realm: localdomain
#      host: hss.localdomain
#
#  o Relative Capacity
#  relative_capacity: 100

# FICTIONAL SAMPLE — /etc/open5gs/nssf.yaml

logger:
  file:
    path: /var/log/open5gs/nssf.log
  level: info

global:
  max:
    ue: 4096

nssf:
  sbi:
    server:
      - address: 127.0.0.14
        port: 7777
        advertise: open5gs-nssf.example.net:7777
    client:
      scp:
        - uri: http://127.0.0.200:7777
      nsi:
        - uri: http://127.0.0.10:7777
          s_nssai:
            sst: 1
  metrics:
    server:
      - address: 127.0.0.14
        port: 9090

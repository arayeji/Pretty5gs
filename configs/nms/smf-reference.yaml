# Open5GS — SMF NMS reference configuration (FICTIONAL SAMPLE DATA ONLY)

logger:
  file:
    path: /var/log/open5gs/smf.log
  level: info

global:
  max:
    ue: 4096
  parameter:
    use_upg_vpp: true
    no_ipv4v6_local_addr_in_packet_filter: true

smf:
  trace_imsi:
    - "999700000000001"

  sbi:
    server:
      - address: 127.0.0.4
        port: 7777
        advertise: open5gs-smf.example.net:7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777
      scp:
        - uri: http://127.0.0.200:7777

  pfcp:
    server:
      - address: 127.0.0.4
        advertise: open5gs-smf-pfcp.example.net
    client:
      upf:
        - address: 127.0.0.7
          service_addr: 10.13.37.7
          tac: [1]
          dnn: internet

  gtpc:
    server:
      - address: 127.0.0.4
        port: 2123

  gtpu:
    server:
      - address: 127.0.0.4

  metrics:
    server:
      - address: 127.0.0.4
        port: 9090

  session:
    # Per-APN RADIUS block (all keys optional, defaults shown here).
    # Keyed by APN name: for APNs spanning several entries (IPv4+IPv6)
    # set it on one entry or repeat it identically on all of them.
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: internet
      radius:
        auth: false           # true = Access-Request required (Access-Reject blocks the session)
        ip_assignment: false  # true = UE IP from Framed-IP-Address / Framed-IPv6-Prefix (needs auth: true)
        skip: false           # true = no RADIUS at all for this APN (no auth, no accounting)
    - subnet: 2001:db8:cafe::/48
      gateway: 2001:db8:cafe::1
      dnn: internet
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
      dnn: ims
      radius:
        skip: true

  dns:
    - 8.8.8.8
    - 2001:4860:4860::8888

  mtu: 1400
  default_pdr_precedence: 65535

  p-cscf:
    - 127.0.0.50
    - 2001:db8:50::1

  ctf:
    enabled: auto

  cdr:
    enabled: true
    spool_dir: /var/spool/open5gs/cdr
    node_id: open5gs-smf-1
    local_address: 127.0.0.4

  radius:
    enabled: false
    select: primary_failover
    nas_identifier: open5gs-smf
    nas_ip: 127.0.0.4
    servers:
      - host: 127.0.0.99
        secret: example-radius-secret
        role: primary

  info:
    - s_nssai:
        - sst: 1
          dnn: [internet, ims]
      tai:
        - plmn_id: { mcc: "999", mnc: "70" }
          tac: [1, 2]

  freeDiameter: /etc/open5gs/freeDiameter/smf.conf
